name: Release Linux Binary

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "agym-release"
          save-if: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp target/release/agym dist/
          tar -czvf agym-linux-x86_64.tar.gz -C dist agym

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "## 🚀 What's Changed in ${{ github.ref_name }}" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "$PREV_TAG..${{ github.ref_name }}" >> release_notes.md
          else
            git log -n 10 --pretty=format:"- %s (%h)" >> release_notes.md
          fi
          echo "" >> release_notes.md

      - name: Upload Release Artifact to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "agym ${{ github.ref_name }}"
          body_path: release_notes.md
          files: agym-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
