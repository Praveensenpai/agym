name: Build and Release Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agym-release-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: agym-linux-x86_64
          path: target/release/agym

  build-macos:
    name: Build macOS ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            architecture: arm64
            asset: agym-macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x86_64
            asset: agym-macos-x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: agym-release-${{ matrix.architecture }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/agym

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package release assets
        run: |
          for asset in agym-linux-x86_64 agym-macos-arm64 agym-macos-x86_64; do
            chmod +x "dist/$asset/agym"
            tar -czf "$asset.tar.gz" -C "dist/$asset" agym
          done

      - name: Generate release notes
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          {
            echo "## What's Changed in ${{ github.ref_name }}"
            echo
            if [ -n "$previous_tag" ]; then
              git log --pretty=format:'- %s (%h)' "$previous_tag..${{ github.ref_name }}"
            else
              git log -n 10 --pretty=format:'- %s (%h)'
            fi
            echo
          } > release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: agym ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            agym-linux-x86_64.tar.gz
            agym-macos-arm64.tar.gz
            agym-macos-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
