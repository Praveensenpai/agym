[package]
name = "agym"
version = "0.1.3"
edition = "2021"
description = "Unified Antigravity CLI Session & Account Manager"

[dependencies]
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
inquire = "0.7.5"
regex = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
